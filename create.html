<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>
    <!---------main body container----->
    <div class="create_container">
        <div class="form">

            <!--------------create account form------------>
            <form>
                <h1>Create Account</h1>
                <P class="description">Provide your details to receive a temporary password</P>
                <label class="surname" for="surname">Surname</label>
                <input type="text" id="surname" name="surname" placeholder="Surname" required>

                <label for="Other _names">Other Names</label>
                <input type="text" id="other_names" name="other_names" placeholder="Other names">

                <label for="phone_number">Phone number</label>

                <!----------------Phone group-------------->
                <div class="phone_container">
                    <select name="country">
                        <option value="+256">Uganda (+256)</option>
                        <option value="+254">Kenya (+254)</option>
                    </select>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="0771189842" required>   
                        
                </div>
                <p class="phone_description">Use an active phone number to receive notifications</p>
                
                

                <label class="email_label" for="Email address">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="fake123@gmail.com">

                <a class="create_email">Don't have an account? Click to register</a>

                <!--------------Button group---------------->
                <div class="btn_container">
                    <button class="btn_close" type="button">Close</button>
                    <button class="btn_create_account" type="submit">Create account</button>
                </div>
                
            </form>
        </div>
    </div>
    
    
</body>
</html>
