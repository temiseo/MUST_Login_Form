<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    
        <div class="login-box">
            <h1 class="university-name">MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
            <div class="portal-container"> 
                <h3 class="portal">Online Application Portal</h3>
            </div>

        <div class="form">

        <form>
            <h2>Welcome back</h2>
            <p>Login in to access your application dashboard</p>

            <label class="email-label" for="Email address">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="fake123@gmail.com">

            <label class="password-label" for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Please enter password">

            <button class="sign-in" name="sign-in" id="Sign in" type="submit">Sign in</button>

            <a class="forgot-password">Forgot your password</a>

            <p class="new-to-portal">New to the portal</p>

        </form>

        <div class="btn-container">
            <button class="create-account" onclick="window.location.href='create.html'" type="button">Create new account</button>
            <button class="register" type="button">How to register</button>
        </div>   
    </div>
    
</body>
</html>
